<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Order intake{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="appbar">
    <div class="appbar-inner">
      <a href="{{ url_for('index') }}" class="appbar-brand">Order Intake</a>
      <span class="appbar-crumb">{% block crumb %}Operations queue{% endblock %}</span>
    </div>
  </header>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
